<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sparekalkulator">
<meta name="theme-color" content="#FAF8FC">
<meta name="format-detection" content="telephone=no">
<title>Sparekalkulator – Telia Play strømmetjenester</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #FAF8FC; min-height: 100vh; color: #221A2E; -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
input, select, .potBtn, .checkRow, .svcMain, .altCard, .btn, .miniBtn, .mathToggle {
  -webkit-tap-highlight-color: rgba(153, 10, 227, 0.08);
}
input, select { font-size: 16px; }
.head { padding: 20px 20px 4px; max-width: 520px; margin: 0 auto; }
.brandTap { display: flex; align-items: center; gap: 12px; user-select: none; -webkit-user-select: none; cursor: default; }
.logoDot { width: 44px; height: 44px; border-radius: 14px; background: #990AE3; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
.brandName { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
.brandSub { font-size: 13px; color: #7A6F87; }
.stack { max-width: 520px; margin: 0 auto; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 14px; }
.card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 1px 3px rgba(60,20,90,0.06); }
.stepLabel { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #990AE3; margin-bottom: 14px; }
.potRow { display: flex; gap: 10px; }
.potBtn { flex: 1; border: 2px solid #EBE3F2; border-radius: 16px; padding: 14px 6px; text-align: center;
  cursor: pointer; background: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.potActive { border-color: #990AE3; background: #F7EDFD; }
.potNum { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.potUnit { font-size: 12px; color: #7A6F87; }
.checkRow { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px;
  border-radius: 14px; border: 2px solid #EBE3F2; cursor: pointer; }
.checkOn { border-color: #990AE3; background: #F7EDFD; }
.checkBox { width: 26px; height: 26px; min-width: 26px; border-radius: 8px; border: 2px solid #C9B8D8;
  display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; color: #fff; background: #fff; }
.checkOn .checkBox, .svcOn .checkBox { background: #990AE3; border-color: #990AE3; }
.checkText { font-size: 15px; font-weight: 500; }
.checkBonus { margin-left: 8px; font-size: 13px; font-weight: 700; color: #990AE3; }
.svcList { display: flex; flex-direction: column; gap: 8px; }
.svcRow { border: 2px solid #EBE3F2; border-radius: 14px; overflow: hidden; }
.svcOn { border-color: #990AE3; }
.svcMain { display: flex; align-items: center; gap: 12px; padding: 13px 14px; cursor: pointer; }
.svcOn .svcMain { background: #F7EDFD; }
.svcName { flex: 1; font-size: 16px; font-weight: 600; }
.svcPts { font-size: 13px; font-weight: 700; color: #7A6F87; background: #F1EBF6; border-radius: 8px; padding: 3px 8px; }
.svcOn .svcPts { color: #990AE3; background: #fff; }
.svcDetail { padding: 10px 14px 13px; background: #F7EDFD; }
.lvlSelect { width: 100%; font-size: 15px; padding: 10px 12px; border-radius: 10px;
  border: 1.5px solid #D9C6E8; background: #fff; color: #221A2E; font-family: inherit; }
.lvlSingle { font-size: 14px; color: #5C4A6E; }
.barTrack { height: 14px; border-radius: 7px; background: #F1EBF6; overflow: hidden; }
.barFill { height: 100%; border-radius: 7px; background: #990AE3; transition: width 0.25s ease; }
.barOver { background: #D6620F; }
.barText { margin-top: 8px; font-size: 14px; font-weight: 600; color: #5C4A6E; }
.barWarn { color: #D6620F; }
.altWrap { margin-top: 14px; }
.altHint { font-size: 14px; color: #5C4A6E; margin-bottom: 10px; }
.altGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.altCard { border: 2px solid #EBE3F2; border-radius: 14px; padding: 12px; cursor: pointer; }
.altActive { border-color: #990AE3; background: #F7EDFD; }
.altTitle { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.altBody { font-size: 12.5px; color: #5C4A6E; line-height: 1.45; }
.altSum { margin-top: 8px; font-size: 14px; font-weight: 800; color: #990AE3; }
.coverList { margin-top: 16px; }
.coverHead { font-size: 13px; font-weight: 700; color: #7A6F87; margin: 10px 0 6px; }
.coverHeadDrop { color: #A78BBE; }
.coverRow { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; padding: 5px 0; }
.coverVal { font-weight: 600; }
.coverDrop { color: #A78BBE; }
.coverExtra { color: #D6620F; font-weight: 600; border-top: 1px solid #F1EBF6; margin-top: 6px; padding-top: 9px; }
.coverEmpty { color: #A78BBE; }
.resultCard { background: #990AE3; border-radius: 24px; padding: 28px 20px; text-align: center;
  color: #fff; box-shadow: 0 6px 20px rgba(153,10,227,0.25); }
.resultLabel { font-size: 15px; font-weight: 600; opacity: 0.85; letter-spacing: 0.3px; }
.resultBig { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; line-height: 1.1; margin: 4px 0; }
.resultUnit { font-size: 24px; font-weight: 700; letter-spacing: 0; }
.resultYear { font-size: 19px; font-weight: 700; opacity: 0.9; }
.mathToggle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 15px; font-weight: 700; }
.mathChev { font-size: 22px; color: #990AE3; }
.mathBody { margin-top: 12px; }
.mathRow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 5px 0; color: #3E3050; }
.mathRow span:last-child { font-weight: 600; white-space: nowrap; }
.mathDivider { border-top: 1px solid #F1EBF6; margin: 8px 0; }
.mathSum { font-weight: 700; color: #221A2E; }
.emptyCard { text-align: center; color: #7A6F87; font-size: 15px; padding: 28px 18px; }
.foot { text-align: center; font-size: 12px; color: #A79DB3; padding: 4px 12px 12px; line-height: 1.5; }
.overlay { position: fixed; inset: 0; background: rgba(20,8,30,0.5); display: flex;
  align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: #fff; border-radius: 20px; padding: 22px; width: 100%; max-width: 320px; }
.modalTitle { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
.pinInput { width: 100%; font-size: 24px; letter-spacing: 8px; text-align: center; padding: 12px;
  border-radius: 12px; border: 2px solid #EBE3F2; font-family: inherit; }
.pinError { color: #C4320A; font-size: 13px; margin-top: 8px; }
.modalBtns { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; text-align: center; padding: 13px; border-radius: 12px; font-size: 15px;
  font-weight: 700; cursor: pointer; user-select: none; }
.btnMain { background: #990AE3; color: #fff; }
.btnGhost { background: #F1EBF6; color: #5C4A6E; }
.adminPanel { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 440px;
  max-height: 88vh; overflow-y: auto; }
.adminUpdated { font-size: 12.5px; color: #7A6F87; margin-top: 2px; }
.adminSection { margin-top: 16px; padding-top: 14px; border-top: 1px solid #F1EBF6; }
.adminLabel { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; color: #990AE3; margin-bottom: 10px; }
.adminLabelSmall { margin-top: 12px; }
.adminSvc { border: 1.5px solid #EBE3F2; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.adminSvcTop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.adminLvl { display: flex; align-items: center; gap: 8px; margin: 6px 0 6px 12px; }
.adminInput { font-size: 14px; padding: 8px 10px; border-radius: 9px; border: 1.5px solid #D9C6E8;
  font-family: inherit; width: 100%; min-width: 0; }
.adminName { flex: 1; font-weight: 600; }
.adminLvlName { flex: 1; }
.adminNum { width: 68px; flex: none; text-align: right; }
.adminUnit { font-size: 13px; color: #7A6F87; flex: none; }
.adminRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 14px; }
.adminRow > span:first-child { flex: 1; }
.miniBtn { font-size: 13px; font-weight: 700; padding: 7px 10px; border-radius: 9px;
  background: #F1EBF6; color: #5C4A6E; cursor: pointer; user-select: none; display: inline-block; flex: none; }
.miniAdd { color: #990AE3; margin-top: 4px; }
.miniDanger { color: #C4320A; background: #FBEDEA; }
.adminBtns { position: sticky; bottom: 0; background: #fff; padding-top: 12px; }
@media (max-width: 380px) {
  .resultBig { font-size: 46px; }
  .altGrid { grid-template-columns: 1fr; }
}
.col { display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 900px) {
  .head { max-width: 1080px; padding-top: 28px; }
  .stack { max-width: 1080px; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 20px; padding: 16px 24px 40px; }
  .colResults { position: sticky; top: 20px; }
  .card { padding: 22px; }
  .resultCard { padding: 36px 24px; }
  .resultBig { font-size: 76px; }
  .resultYear { font-size: 22px; }
  .svcMain { padding: 14px 16px; }
  .foot { grid-column: 1 / -1; }
  .emptyCard { padding: 48px 24px; }
  .adminPanel { max-width: 620px; }
}
</style>
</head>
<body>

<header class="head">
  <div class="brandTap" id="brandTap">
    <div class="logoDot">T</div>
    <div>
      <div class="brandName">Telia Play</div>
      <div class="brandSub">Sparekalkulator for strømmetjenester</div>
    </div>
  </div>
</header>

<main class="stack" id="main"></main>
<div id="modals"></div>

<script>
"use strict";

const STORAGE_KEY = "telia-kalkulator-config";

const DEFAULT_CONFIG = {
  pots: [15, 40, 60],
  defaultPot: 60,
  mobileBonus: 10,
  extraPricePer10: 25,
  pin: "1234",
  lastUpdated: null,
  services: [
    { id: "netflix", name: "Netflix", points: 50, levels: [
      { name: "Basis m/reklame", price: 119 },
      { name: "Standard", price: 149 },
      { name: "Premium", price: 219 } ]},
    { id: "hbomax", name: "HBO Max", points: 30, levels: [
      { name: "Basis m/reklame", price: 89 },
      { name: "Standard", price: 149 },
      { name: "Premium", price: 189 } ]},
    { id: "viaplay", name: "Viaplay", points: 45, levels: [
      { name: "Film og serier", price: 159 } ]},
    { id: "prime", name: "Prime Video", points: 30, levels: [
      { name: "Standard (m/reklame)", price: 79 },
      { name: "Uten reklame", price: 108 } ]},
    { id: "tv2play", name: "TV 2 Play", points: 10, levels: [
      { name: "Start m/reklame", price: 129 } ]},
    { id: "disney", name: "Disney+", points: 40, levels: [
      { name: "Standard m/reklame", price: 69 },
      { name: "Uten reklame", price: 99 } ]},
    { id: "skyshowtime", name: "SkyShowtime", points: 30, levels: [
      { name: "Standard", price: 79 } ]},
    { id: "britbox", name: "BritBox", points: 10, levels: [
      { name: "Standard", price: 59 } ]},
  ],
};

// ---------- Tilstand ----------
let config = loadConfig();
let pot = config.pots.includes(config.defaultPot) ? config.defaultPot : (config.pots[config.pots.length - 1] || 0);
let hasMobile = false;
let selections = {};       // { serviceId: levelIndex }
let altMode = "buy";       // "buy" | "fit"
let showMath = false;
let draft = null;          // adminkladd

function loadConfig() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.services)) return parsed;
    }
  } catch (e) { /* utilgjengelig lagring — bruk startdata */ }
  return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}

function persist(next) {
  next.lastUpdated = new Date().toISOString();
  config = next;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) { /* gjelder for økten */ }
}

const kr = n => n.toLocaleString("nb-NO");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// ---------- Beregning ----------
function calc() {
  const chosen = config.services
    .filter(s => selections[s.id] !== undefined && s.levels[selections[s.id]])
    .map(s => ({
      id: s.id, name: s.name, points: s.points,
      levelName: s.levels[selections[s.id]].name,
      price: s.levels[selections[s.id]].price,
    }));

  const totalPrice = chosen.reduce((a, c) => a + c.price, 0);
  const totalPoints = chosen.reduce((a, c) => a + c.points, 0);
  const available = pot + (hasMobile ? config.mobileBonus : 0);
  const over = totalPoints > available;

  const extraPoints = over ? Math.ceil((totalPoints - available) / 10) * 10 : 0;
  const extraCost = (extraPoints / 10) * config.extraPricePer10;
  const buy = { covered: chosen, dropped: [], extraPoints, extraCost,
    savingMonth: totalPrice - extraCost, pointsUsed: totalPoints };

  let fit = null;
  if (over) {
    const sorted = [...chosen].sort((a, b) => b.price / b.points - a.price / a.points);
    const packed = []; let used = 0;
    for (const c of sorted) {
      if (used + c.points <= available) { packed.push(c); used += c.points; }
    }
    fit = {
      covered: packed,
      dropped: chosen.filter(c => !packed.some(p => p.id === c.id)),
      extraPoints: 0, extraCost: 0,
      savingMonth: packed.reduce((a, c) => a + c.price, 0),
      pointsUsed: used,
    };
  }

  const active = over && altMode === "fit" && fit ? fit : buy;
  return { chosen, totalPrice, totalPoints, available, over, buy, fit, active };
}

// ---------- Hovedvisning ----------
function render() {
  const c = calc();
  const a = c.active;
  const pct = c.available > 0 ? Math.min(100, (c.totalPoints / c.available) * 100) : 0;

  let inputs = `
  <section class="card">
    <div class="stepLabel">Poengpotten din</div>
    <div class="potRow">
      ${config.pots.map(p => `
        <div class="potBtn${pot === p ? " potActive" : ""}" data-action="pot" data-pot="${p}">
          <span class="potNum">${p}</span><span class="potUnit">poeng</span>
        </div>`).join("")}
    </div>
    <div class="checkRow${hasMobile ? " checkOn" : ""}" data-action="mobile">
      <div class="checkBox">${hasMobile ? "✓" : ""}</div>
      <div class="checkText">Har også mobilabonnement hos Telia
        <span class="checkBonus">+${config.mobileBonus} poeng</span></div>
    </div>
  </section>

  <section class="card">
    <div class="stepLabel">Hva betaler du for i dag?</div>
    <div class="svcList">
      ${config.services.map(s => {
        const on = selections[s.id] !== undefined;
        const lvlIdx = on ? selections[s.id] : 0;
        return `
        <div class="svcRow${on ? " svcOn" : ""}">
          <div class="svcMain" data-action="toggleSvc" data-svc="${esc(s.id)}">
            <div class="checkBox">${on ? "✓" : ""}</div>
            <div class="svcName">${esc(s.name)}</div>
            <div class="svcPts">${s.points} p</div>
          </div>
          ${on ? `<div class="svcDetail">
            ${s.levels.length > 1 ? `
              <select class="lvlSelect" data-action="level" data-svc="${esc(s.id)}">
                ${s.levels.map((l, i) => `<option value="${i}"${i === lvlIdx ? " selected" : ""}>${esc(l.name)} — ${kr(l.price)} kr/md.</option>`).join("")}
              </select>` : `
              <div class="lvlSingle">${esc(s.levels[0].name)} — ${kr(s.levels[0].price)} kr/md.</div>`}
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
  </section>`;

  let results = "";
  if (c.chosen.length > 0) {
    results += `
    <section class="card">
      <div class="stepLabel">Poengbruk</div>
      <div class="barTrack"><div class="barFill${c.over ? " barOver" : ""}" style="width:${pct}%"></div></div>
      <div class="barText">${c.totalPoints} av ${c.available} poeng${c.over ? `<span class="barWarn"> — ${c.totalPoints - c.available} poeng over</span>` : ""}</div>

      ${c.over && c.fit ? `
      <div class="altWrap">
        <div class="altHint">Tjenestene bruker mer enn potten. Velg løsning:</div>
        <div class="altGrid">
          <div class="altCard${altMode === "buy" ? " altActive" : ""}" data-action="alt" data-alt="buy">
            <div class="altTitle">Kjøp ekstra poeng</div>
            <div class="altBody">+${c.buy.extraPoints} poeng for ${kr(c.buy.extraCost)} kr/md. Alle ${c.chosen.length} tjenester dekkes.</div>
            <div class="altSum">Sparer ${kr(c.buy.savingMonth)} kr/md.</div>
          </div>
          <div class="altCard${altMode === "fit" ? " altActive" : ""}" data-action="alt" data-alt="fit">
            <div class="altTitle">Bare det som får plass</div>
            <div class="altBody">${c.fit.covered.length} av ${c.chosen.length} tjenester — kombinasjonen med mest kroneverdi per poeng.</div>
            <div class="altSum">Sparer ${kr(c.fit.savingMonth)} kr/md.</div>
          </div>
        </div>
      </div>` : ""}

      <div class="coverList">
        <div class="coverHead">Dekkes av poeng:</div>
        ${a.covered.map(x => `<div class="coverRow"><span>${esc(x.name)} · ${esc(x.levelName)}</span><span class="coverVal">${kr(x.price)} kr/md.</span></div>`).join("")}
        ${a.covered.length === 0 ? `<div class="coverRow coverEmpty">Ingen av tjenestene får plass i potten.</div>` : ""}
        ${c.over && altMode === "fit" && c.fit.dropped.length ? `
          <div class="coverHead coverHeadDrop">Utenfor potten (beholdes som i dag):</div>
          ${c.fit.dropped.map(x => `<div class="coverRow coverDrop"><span>${esc(x.name)} · ${esc(x.levelName)}</span><span>${kr(x.price)} kr/md.</span></div>`).join("")}` : ""}
        ${a.extraCost > 0 ? `<div class="coverRow coverExtra"><span>Ekstra poeng (${a.extraPoints} p)</span><span>−${kr(a.extraCost)} kr/md.</span></div>` : ""}
      </div>
    </section>

    <section class="resultCard">
      <div class="resultLabel">Du sparer</div>
      <div class="resultBig">${kr(a.savingMonth)} <span class="resultUnit">kr/md.</span></div>
      <div class="resultYear">${kr(a.savingMonth * 12)} kr/år</div>
    </section>

    <section class="card">
      <div class="mathToggle" data-action="math">
        <span>Slik regnet vi</span><span class="mathChev">${showMath ? "−" : "+"}</span>
      </div>
      ${showMath ? `
      <div class="mathBody">
        <div class="mathRow"><span>Du betaler i dag (${c.chosen.length} tjenester)</span><span>${kr(c.totalPrice)} kr/md.</span></div>
        <div class="mathRow"><span>Poengbehov</span><span>${c.totalPoints} poeng</span></div>
        <div class="mathRow"><span>Tilgjengelige poeng (${pot}${hasMobile ? ` + ${config.mobileBonus} mobil` : ""})</span><span>${c.available} poeng</span></div>
        <div class="mathDivider"></div>
        <div class="mathRow"><span>Verdi av tjenester dekket av poeng</span><span>${kr(a.covered.reduce((x, y) => x + y.price, 0))} kr/md.</span></div>
        <div class="mathRow"><span>− Kostnad for ekstra poeng (${a.extraPoints} p à ${config.extraPricePer10} kr per 10)</span><span>${kr(a.extraCost)} kr/md.</span></div>
        <div class="mathDivider"></div>
        <div class="mathRow mathSum"><span>Besparelse per måned</span><span>${kr(a.savingMonth)} kr</span></div>
        <div class="mathRow mathSum"><span>× 12 måneder</span><span>${kr(a.savingMonth * 12)} kr/år</span></div>
      </div>` : ""}
    </section>`;
  } else {
    results += `<section class="card emptyCard">Kryss av tjenestene du betaler for i dag, så regner vi ut hva du kan spare.</section>`;
  }

  document.getElementById("main").innerHTML = `
    <div class="col">${inputs}</div>
    <div class="col colResults">${results}</div>
    <footer class="foot">Veiledende priser per august 2026. Sjekk gjeldende pris hos den enkelte tjenesten.</footer>`;
}

// ---------- Klikk i hovedvisningen ----------
document.getElementById("main").addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const act = el.dataset.action;
  if (act === "pot") { pot = Number(el.dataset.pot); render(); }
  else if (act === "mobile") { hasMobile = !hasMobile; render(); }
  else if (act === "toggleSvc") {
    const id = el.dataset.svc;
    if (selections[id] !== undefined) delete selections[id];
    else selections[id] = 0;
    render();
  }
  else if (act === "alt") { altMode = el.dataset.alt; render(); }
  else if (act === "math") { showMath = !showMath; render(); }
});
document.getElementById("main").addEventListener("change", e => {
  const el = e.target.closest("[data-action='level']");
  if (el) { selections[el.dataset.svc] = Number(el.value); render(); }
});

// ---------- Admin-åpning: 5 raske trykk ----------
let tapCount = 0, tapTimer = null;
document.getElementById("brandTap").addEventListener("click", () => {
  tapCount++;
  clearTimeout(tapTimer);
  if (tapCount >= 5) { tapCount = 0; showPin(); }
  else tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
});

function showPin() {
  document.getElementById("modals").innerHTML = `
  <div class="overlay" id="pinOverlay">
    <div class="modal">
      <div class="modalTitle">PIN-kode</div>
      <input class="pinInput" id="pinInput" type="password" inputmode="numeric" autocomplete="off">
      <div class="pinError" id="pinError" style="display:none">Feil PIN. Prøv igjen.</div>
      <div class="modalBtns">
        <div class="btn btnGhost" id="pinCancel">Avbryt</div>
        <div class="btn btnMain" id="pinOk">Åpne</div>
      </div>
    </div>
  </div>`;
  const inp = document.getElementById("pinInput");
  inp.focus();
  const tryPin = () => {
    if (inp.value === config.pin) openAdmin();
    else { document.getElementById("pinError").style.display = "block"; inp.value = ""; inp.focus(); }
  };
  document.getElementById("pinOk").addEventListener("click", tryPin);
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });
  document.getElementById("pinCancel").addEventListener("click", closeModals);
  document.getElementById("pinOverlay").addEventListener("click", e => { if (e.target.id === "pinOverlay") closeModals(); });
}

function closeModals() { draft = null; document.getElementById("modals").innerHTML = ""; }

// ---------- Admin-panel ----------
function openAdmin() {
  draft = JSON.parse(JSON.stringify(config));
  renderAdmin();
}

function renderAdmin(savedFlash) {
  const updated = config.lastUpdated
    ? "Sist oppdatert: " + new Date(config.lastUpdated).toLocaleDateString("nb-NO", { day: "numeric", month: "long", year: "numeric" })
    : "Ikke lagret ennå (startdata)";

  document.getElementById("modals").innerHTML = `
  <div class="overlay">
    <div class="adminPanel">
      <div class="modalTitle">Admin</div>
      <div class="adminUpdated">${esc(updated)}</div>

      <div class="adminSection">
        <div class="adminLabel">Tjenester</div>
        ${draft.services.map((s, si) => `
        <div class="adminSvc">
          <div class="adminSvcTop">
            <input class="adminInput adminName" data-field="svcName" data-si="${si}" value="${esc(s.name)}">
            <input class="adminInput adminNum" data-field="svcPoints" data-si="${si}" type="number" value="${s.points}">
            <span class="adminUnit">p</span>
            <div class="miniBtn miniDanger" data-aact="rmSvc" data-si="${si}">Fjern</div>
          </div>
          ${s.levels.map((l, li) => `
          <div class="adminLvl">
            <input class="adminInput adminLvlName" data-field="lvlName" data-si="${si}" data-li="${li}" value="${esc(l.name)}">
            <input class="adminInput adminNum" data-field="lvlPrice" data-si="${si}" data-li="${li}" type="number" value="${l.price}">
            <span class="adminUnit">kr</span>
            <div class="miniBtn" data-aact="rmLvl" data-si="${si}" data-li="${li}">×</div>
          </div>`).join("")}
          <div class="miniBtn miniAdd" data-aact="addLvl" data-si="${si}">+ Nivå</div>
        </div>`).join("")}
        <div class="miniBtn miniAdd" data-aact="addSvc">+ Legg til tjeneste</div>
      </div>

      <div class="adminSection">
        <div class="adminLabel">Poeng og priser</div>
        <div class="adminRow"><span>Pris per 10 ekstra poeng</span>
          <input class="adminInput adminNum" data-field="extraPrice" type="number" value="${draft.extraPricePer10}"><span class="adminUnit">kr</span></div>
        <div class="adminRow"><span>Mobilbonus</span>
          <input class="adminInput adminNum" data-field="mobileBonus" type="number" value="${draft.mobileBonus}"><span class="adminUnit">p</span></div>
        <div class="adminLabel adminLabelSmall">Valgbare poengpotter</div>
        ${draft.pots.map((p, pi) => `
        <div class="adminRow">
          <input class="adminInput adminNum" data-field="pot" data-pi="${pi}" type="number" value="${p}">
          <span class="adminUnit">poeng</span>
          <div class="miniBtn" data-aact="rmPot" data-pi="${pi}">×</div>
        </div>`).join("")}
        <div class="miniBtn miniAdd" data-aact="addPot">+ Pott</div>
      </div>

      <div class="adminSection">
        <div class="adminLabel">PIN-kode</div>
        <input class="adminInput" data-field="pin" value="${esc(draft.pin)}">
      </div>

      <div class="adminSection">
        <div class="miniBtn miniDanger" data-aact="reset">Tilbakestill til startdata</div>
      </div>

      <div class="modalBtns adminBtns">
        <div class="btn btnGhost" data-aact="close">Lukk</div>
        <div class="btn btnMain" data-aact="save">${savedFlash ? "Lagret ✓" : "Lagre endringer"}</div>
      </div>
    </div>
  </div>`;

  const panel = document.querySelector(".adminPanel");

  // Tekst-/tallfelter oppdaterer kladden uten re-render (beholder fokus)
  panel.addEventListener("input", e => {
    const f = e.target.dataset.field;
    if (!f) return;
    const si = Number(e.target.dataset.si), li = Number(e.target.dataset.li), pi = Number(e.target.dataset.pi);
    const num = v => Math.max(0, Number(v) || 0);
    if (f === "svcName") draft.services[si].name = e.target.value;
    else if (f === "svcPoints") draft.services[si].points = num(e.target.value);
    else if (f === "lvlName") draft.services[si].levels[li].name = e.target.value;
    else if (f === "lvlPrice") draft.services[si].levels[li].price = num(e.target.value);
    else if (f === "extraPrice") draft.extraPricePer10 = num(e.target.value);
    else if (f === "mobileBonus") draft.mobileBonus = num(e.target.value);
    else if (f === "pot") draft.pots[pi] = num(e.target.value);
    else if (f === "pin") draft.pin = e.target.value;
  });

  panel.addEventListener("click", e => {
    const el = e.target.closest("[data-aact]");
    if (!el) return;
    const act = el.dataset.aact;
    const si = Number(el.dataset.si), li = Number(el.dataset.li), pi = Number(el.dataset.pi);
    if (act === "rmSvc") { draft.services.splice(si, 1); renderAdmin(); }
    else if (act === "rmLvl") { draft.services[si].levels.splice(li, 1); renderAdmin(); }
    else if (act === "addLvl") { draft.services[si].levels.push({ name: "Nytt nivå", price: 99 }); renderAdmin(); }
    else if (act === "addSvc") {
      draft.services.push({ id: "svc" + Date.now(), name: "Ny tjeneste", points: 10, levels: [{ name: "Standard", price: 99 }] });
      renderAdmin();
    }
    else if (act === "rmPot") { draft.pots.splice(pi, 1); renderAdmin(); }
    else if (act === "addPot") { draft.pots.push(20); renderAdmin(); }
    else if (act === "reset") { draft = JSON.parse(JSON.stringify(DEFAULT_CONFIG)); renderAdmin(); }
    else if (act === "close") { closeModals(); }
    else if (act === "save") {
      const cleaned = {
        ...draft,
        pots: draft.pots.filter(p => p > 0).sort((a, b) => a - b),
        services: draft.services.filter(s => s.name.trim() && s.levels.length > 0),
      };
      persist(cleaned);
      draft = JSON.parse(JSON.stringify(config));
      // Rydd valg som ikke lenger finnes
      const next = {};
      for (const s of config.services) {
        if (selections[s.id] !== undefined) next[s.id] = Math.min(selections[s.id], s.levels.length - 1);
      }
      selections = next;
      if (!config.pots.includes(pot) && config.pots.length) {
        pot = config.pots.includes(config.defaultPot) ? config.defaultPot : config.pots[config.pots.length - 1];
      }
      render();
      renderAdmin();
      const btn = document.querySelector("[data-aact='save']");
      if (btn) btn.textContent = "Lagret ✓";
      setTimeout(() => {
        const b = document.querySelector("[data-aact='save']");
        if (b) b.textContent = "Lagre endringer";
      }, 1800);
    }
  });
}

render();
</script>
</body>
</html>
